services:
  backend:
    build:
      context: ./backend/VitrineAPI
      dockerfile: VitrineAPI/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}

  frontend:
    build:
      context: ./vitrine
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
